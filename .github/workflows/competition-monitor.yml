name: Competition Monitor
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and competition readiness
        run: |
          npm test
          node scripts/readiness.mjs
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: competition-readiness
          path: readiness.json
          retention-days: 14
